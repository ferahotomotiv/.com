name: Build FERAH AUTO Single Windows Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build single offline installer
        shell: pwsh
        run: .\windows\build-single-setup.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FERAH-AUTO-TEK-KURULUM-WINDOWS-x64
          path: release/FERAH-AUTO-TEK-KURULUM.exe
          if-no-files-found: error
          retention-days: 30
