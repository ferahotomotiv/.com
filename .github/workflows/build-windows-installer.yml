name: Build FERAH AUTO Single Windows Setup

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "windows/**"
      - "local-server/**"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js build runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build frontend and single installer
        shell: pwsh
        run: .\windows\build-single-setup.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FERAH-AUTO-TEK-KURULUM-WINDOWS-x64
          path: release/FERAH-AUTO-TEK-KURULUM.exe
          if-no-files-found: error
          retention-days: 30
