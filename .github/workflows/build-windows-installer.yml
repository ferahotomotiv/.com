name: Build FERAH AUTO Desktop and Android Apps

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "public/**"
      - "desktop/**"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "windows/**"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build desktop installer
        shell: pwsh
        run: .\windows\build-single-setup.ps1
      - name: Upload Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: FERAH-AUTO-WINDOWS-KURULUM-x64
          path: release/FERAH-AUTO-WINDOWS-KURULUM.exe
          if-no-files-found: error
          retention-days: 30

  build-android-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Capacitor dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Set Android minimum SDK to 26
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/variables.gradle")
          if p.exists():
              s = p.read_text()
              s = s.replace("minSdkVersion = 23", "minSdkVersion = 26")
              p.write_text(s)
          PY
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FERAH-AUTO-ANDROID-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
